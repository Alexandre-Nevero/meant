<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MEANT — Ledger fixture</title>
<link rel="stylesheet" href="fixtures.css" />
</head>
<body class="m-app">
<div data-surface="ledger" style="max-width:1000px;margin:0 auto;padding:72px 80px;display:flex;flex-direction:column;gap:24px;">
  <h1 class="m-rate">Eleven this month. Seven finished.</h1>

  <div class="m-row">
    <p class="m-sentence">finish the client proposal</p>
    <p class="m-mark" data-state="ended"><span class="m-row-bar" data-kind="attention-1" style="flex:41"></span><span class="m-row-bar" data-kind="attention-2" style="flex:21"></span><span class="m-row-bar" data-kind="away" style="flex:6"></span></p>
    <p class="m-meta" style="color:var(--m-ink)">Not yet</p>
  </div>
  <div class="m-row">
    <p class="m-sentence">reply to the vendor thread</p>
    <p class="m-mark" data-state="ended"><span class="m-row-bar" data-kind="attention-1" style="flex:14"></span><span class="m-row-bar" data-kind="attention-2" style="flex:3"></span><span class="m-row-bar" data-kind="away" style="flex:1"></span></p>
    <p class="m-meta" style="color:var(--m-ink)">Yes</p>
  </div>
  <div class="m-row">
    <p class="m-sentence">read the Q3 brief properly</p>
    <p class="m-mark" data-state="ended"><span class="m-row-bar" data-kind="attention-1" style="flex:26"></span><span class="m-row-bar" data-kind="attention-2" style="flex:5"></span><span class="m-row-bar" data-kind="away" style="flex:2"></span></p>
    <p class="m-meta" style="color:var(--m-ink)">Yes</p>
  </div>
  <div class="m-row">
    <p class="m-meta">No intention given</p>
    <p class="m-mark" data-state="ended"><span class="m-row-bar" data-kind="attention-1" style="flex:8"></span><span class="m-row-bar" data-kind="attention-2" style="flex:6"></span><span class="m-row-bar" data-kind="away" style="flex:8"></span></p>
    <p class="m-meta">Unanswered</p>
  </div>
  <div class="m-row">
    <p class="m-sentence">draft the handover notes</p>
    <p class="m-mark" data-state="ended"><span class="m-row-bar" data-kind="attention-1" style="flex:19"></span><span class="m-row-bar" data-kind="attention-2" style="flex:4"></span><span class="m-row-bar" data-kind="away" style="flex:4"></span></p>
    <p class="m-meta" style="color:var(--m-ink)">Not yet</p>
  </div>
</div>
</body>
</html>
