<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MEANT — Popup running fixture</title>
<link rel="stylesheet" href="../../extension/meant.css" />
</head>
<body class="m-app" data-surface="popup" style="width:360px;">
<main id="root">
  <div data-popup-header="true">
    <p class="m-mark" data-state="running"></p>
    <div class="m-chip-row">
      <button class="m-btn" data-variant="quiet" aria-label="View session history">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/><path d="M7 4v3l2 1.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
      <button class="m-btn" data-variant="quiet" aria-label="Open meant.app">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M6 2H2v10h10V8M8 2h4v4M12 2 6 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </div>
  </div>

  <!-- The intention pill's own outline carries the live per-site attention loop (round 5) —
       traced clockwise from top-dead-centre, 2px stroke, 3px gaps, solid --m-edge remainder.
       data-loop="on" is what popup.js sets once it measures the pill, which is also what
       turns the pill's own border transparent (extension/meant.css) so only the SVG paints. -->
  <div data-timer-pill="true" data-loop="on">
    <p class="m-sentence">finish the client proposal</p>
    <svg viewBox="0 0 320 79" aria-hidden="true" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;">
      <path d="M 160 1 H 293 A 26 26 0 0 1 319 27 V 53 A 26 26 0 0 1 293 79 H 27 A 26 26 0 0 1 1 53 V 27 A 26 26 0 0 1 27 1 H 160" fill="none" style="stroke:var(--m-clay);" stroke-width="2" stroke-linecap="butt" stroke-dasharray="297 450" stroke-dashoffset="0" />
      <path d="M 160 1 H 293 A 26 26 0 0 1 319 27 V 53 A 26 26 0 0 1 293 79 H 27 A 26 26 0 0 1 1 53 V 27 A 26 26 0 0 1 27 1 H 160" fill="none" style="stroke:var(--m-clay-2);" stroke-width="2" stroke-linecap="butt" stroke-dasharray="107 640" stroke-dashoffset="447" />
      <path d="M 160 1 H 293 A 26 26 0 0 1 319 27 V 53 A 26 26 0 0 1 293 79 H 27 A 26 26 0 0 1 1 53 V 27 A 26 26 0 0 1 27 1 H 160" fill="none" style="stroke:var(--m-clay-3);" stroke-width="2" stroke-linecap="butt" stroke-dasharray="52 695" stroke-dashoffset="337" />
      <path d="M 160 1 H 293 A 26 26 0 0 1 319 27 V 53 A 26 26 0 0 1 293 79 H 27 A 26 26 0 0 1 1 53 V 27 A 26 26 0 0 1 27 1 H 160" fill="none" style="stroke:var(--m-edge);" stroke-width="2" stroke-linecap="butt" stroke-dasharray="279 468" stroke-dashoffset="282" />
    </svg>
  </div>

  <p class="m-meta">41 min · 9 min left</p>
  <p class="m-meta">blocking: gmail.com, amazon.com</p>

  <button class="m-btn" data-variant="quiet">Stop</button>
</main>
</body>
</html>
