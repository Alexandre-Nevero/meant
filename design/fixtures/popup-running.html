<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MEANT — Popup running fixture</title>
<link rel="stylesheet" href="../../extension/meant.css" />
</head>
<body class="m-app" data-surface="popup" style="width:360px;">
<main id="root">
  <div style="display:flex;justify-content:space-between;align-items:baseline;">
    <p class="m-meta">Running</p>
    <p class="m-row-figure">41 min</p>
  </div>
  <p class="m-sentence">finish the client proposal</p>

  <p class="m-mark" data-state="ended" style="width:100%;height:14px;">
    <span class="m-row-bar" data-kind="attention-1" style="flex:28"></span>
    <span class="m-row-bar" data-kind="attention-2" style="flex:9"></span>
    <span class="m-row-bar" data-kind="away" style="flex:4"></span>
  </p>

  <div class="m-row"><span class="m-row-bar" data-kind="step-done"></span><span class="m-row-domain">outline the scope</span></div>
  <div class="m-row"><span class="m-row-bar" data-kind="step-open"></span><span class="m-row-domain">write the pricing section</span></div>
  <div class="m-row"><span class="m-row-bar" data-kind="step-open"></span><span class="m-row-domain">send it</span></div>

  <p class="m-meta">claude.ai now. social blocked.</p>

  <button class="m-btn" data-variant="quiet">Stop</button>
</main>
</body>
</html>
