<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MEANT — Popup idle fixture</title>
<link rel="stylesheet" href="../../extension/meant.css" />
</head>
<body class="m-app" data-surface="popup" style="width:360px;">
<main id="root">
  <p class="m-mark" data-state="idle"></p>
  <p class="m-meta">What do you mean to do?</p>
  <input class="m-field" placeholder="" />
  <div class="m-chip-row">
    <button class="m-chip" data-mono="true" aria-pressed="true">25 min</button>
    <button class="m-chip" data-mono="true" aria-pressed="false">50 min</button>
    <button class="m-chip" data-mono="true" aria-pressed="false">until I stop</button>
  </div>
  <div class="m-chip-row">
    <button class="m-chip" data-mono="true" aria-pressed="false">25/5</button>
    <button class="m-chip" data-mono="true" aria-pressed="false">50/10</button>
    <button class="m-chip" data-mono="true" aria-pressed="false">custom</button>
    <button class="m-chip" data-mono="true" aria-pressed="true">no cycles</button>
  </div>
  <div data-chip-layout="cluster">
    <div data-chip-layout="group">
      <p class="m-meta">where it happens</p>
      <div class="m-chip-row">
        <button class="m-chip" aria-pressed="true">claude.ai</button>
        <button class="m-chip" aria-pressed="true">github.com</button>
        <button class="m-chip" aria-pressed="false">+</button>
      </div>
    </div>
    <div data-chip-layout="group">
      <p class="m-meta">blocking 4</p>
      <div class="m-chip-row">
        <button class="m-chip" aria-pressed="true">gmail.com</button>
        <button class="m-chip" aria-pressed="true">amazon.com</button>
        <button class="m-chip" aria-pressed="true">linkedin.com</button>
        <button class="m-chip" aria-pressed="true">tiktok.com</button>
        <button class="m-chip" aria-pressed="false">+</button>
      </div>
    </div>
  </div>
  <button class="m-btn" data-variant="primary">Start</button>
</main>
</body>
</html>
