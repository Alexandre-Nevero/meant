<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>MEANT — Popup unpaired fixture</title>
<link rel="stylesheet" href="../../extension/meant.css" />
</head>
<body class="m-app" data-surface="popup" style="width:360px;">
<main id="root">
  <p class="m-mark" data-state="idle"></p>
  <p class="m-meta">Connect this browser to your account.</p>
  <input class="m-field" data-pairing-code="true" placeholder="PAIRING CODE" maxlength="6" />
  <button class="m-btn" data-variant="primary">Pair</button>
  <button class="m-btn" data-variant="quiet">Get a code</button>
</main>
</body>
</html>
