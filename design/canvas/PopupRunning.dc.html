<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500&family=Sometype+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #14120F; } a:hover { color: #57534E; }
  </style>
</helmet>
<div style="width: 360px; height: 560px; box-sizing: border-box; background: #F3F1EE; font-family: 'Public Sans', system-ui, sans-serif; color: #14120F; letter-spacing: -0.02em; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;">

  <div style="display: flex; justify-content: space-between; align-items: baseline;">
    <p style="margin: 0; font-size: 13px; color: #8B8681;">Running</p>
    <p style="margin: 0; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 13px; font-variant-numeric: tabular-nums;">41 min</p>
  </div>

  <div style="border: 1.5px solid #14120F; border-radius: 26px; padding: 16px 22px; min-height: 84px;">
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 1.3; letter-spacing: -0.02em;">finish the client proposal</p>
  </div>

  <div style="display: flex; gap: 3px; height: 14px;">
    <div style="flex: 28; background: #C75B39; border-radius: 7px;"></div>
    <div style="flex: 9; background: #D68A6E; border-radius: 7px;"></div>
    <div style="flex: 4; border-radius: 7px; background: repeating-linear-gradient(135deg, #8B8681 0 2px, transparent 2px 6px); border: 1px solid #C7C2BB;"></div>
    <div style="flex: 27; background: transparent; border: 0.5px dashed #C7C2BB; border-radius: 7px;"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0;">
    <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 11px minmax(0, 1fr); gap: 12px; align-items: center; padding: 8px 0;">
        <span style="width: 11px; height: 11px; border-radius: 3px; background: {{step.fill}}; border: 1px solid {{step.edge}}; box-sizing: border-box;"></span>
        <p style="margin: 0; font-size: 13px; color: {{step.ink}};">{{step.text}}</p>
      </div>
    </sc-for>
  </div>

  <p style="margin: 0; font-size: 13px; color: #8B8681; line-height: 1.45;">claude.ai now. social blocked.</p>

  <button style="margin-top: auto; padding: 15px 0; font-size: 15px; letter-spacing: -0.02em; color: #14120F; background: transparent; border: 0.5px solid #14120F; border-radius: 28px; cursor: pointer;">Stop</button>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":360,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { text: 'outline the scope',         fill: '#C75B39',     edge: '#C75B39', ink: '#8B8681' },
        { text: 'write the pricing section', fill: 'transparent', edge: '#C7C2BB', ink: '#14120F' },
        { text: 'send it',                   fill: 'transparent', edge: '#C7C2BB', ink: '#14120F' }
      ]
    };
  }
}
</script>
</body>
</html>
