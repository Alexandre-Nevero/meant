<!-- Round 5: the attention loop is traced directly on the intention pill's own rounded-rect
     outline (26px corner radius, same as --m-r-field) instead of a separate strip below it.

     3-step plan list is gone; that concept left the product before this round started. -->
<div style="width: 360px; height: 300px; box-sizing: border-box; background: #F3F1EE; font-family: 'Public Sans', system-ui, sans-serif; color: #14120F; letter-spacing: -0.02em; padding: 20px; display: flex; flex-direction: column; gap: 18px;">

    </p>
    <div style="display: flex; gap: 8px;">

      </button>

        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M6 2H2v10h10V8M8 2h4v4M12 2 6 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
      </button>
    </div>
  </div>

  <!-- The pill: outline holds the sentence, and its own stroke doubles as the session's
       live per-site attention loop. No border drawn directly — the SVG paths ARE the line. -->
  <div style="position: relative; width: 320px; height: 79px; box-sizing: border-box; border-radius: 26px; overflow: hidden;">
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 1.3; letter-spacing: -0.02em; padding: 16px 22px; box-sizing: border-box; height: 100%; display: flex; align-items: center;">finish the client proposal</p>

      <!-- Clockwise from top-dead-centre (M 160 1 ...), same authored path reused per segment,

    </svg>
  </div>

  <p style="margin: 0; font-size: 13px; color: #8B8681; line-height: 1.45;">41 min · 9 min left</p>
