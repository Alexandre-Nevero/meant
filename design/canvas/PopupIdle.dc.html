<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500&family=Sometype+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #14120F; } a:hover { color: #57534E; }
    @keyframes caret { 50% { opacity: 0; } }
    .caret { animation: caret 1.1s steps(1, end) infinite; }
    @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
  </style>
</helmet>
<div style="width: 360px; height: 420px; box-sizing: border-box; background: #F3F1EE; font-family: 'Public Sans', system-ui, sans-serif; color: #14120F; letter-spacing: -0.02em; padding: 24px 20px; display: flex; flex-direction: column; gap: 20px;">

  <p style="margin: 0; font-size: 13px; color: #8B8681;">What do you mean to do?</p>

  <div style="border: 1.5px solid #14120F; border-radius: 26px; padding: 16px 22px; min-height: 84px; display: flex; align-items: flex-start;">
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 20px; line-height: 1.3; letter-spacing: -0.02em; color: #8B8681;"><span class="caret" style="color: #14120F;">|</span></p>
  </div>

  <div style="display: flex; gap: 8px;">
    <button style="padding: 8px 14px; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 12px; color: #14120F; background: transparent; border: 0.5px solid #14120F; border-radius: 999px; cursor: pointer;">25 min</button>
    <button style="padding: 8px 14px; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 12px; color: #8B8681; background: transparent; border: 0.5px solid #C7C2BB; border-radius: 999px; cursor: pointer;">50 min</button>
    <button style="padding: 8px 14px; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 12px; color: #8B8681; background: transparent; border: 0.5px solid #C7C2BB; border-radius: 999px; cursor: pointer;">until I stop</button>
  </div>

  <div style="display: flex; gap: 8px;">
    <button style="padding: 8px 14px; font-size: 13px; color: #14120F; background: transparent; border: 0.5px solid #14120F; border-radius: 999px; cursor: pointer;">social</button>
    <button style="padding: 8px 14px; font-size: 13px; color: #8B8681; background: transparent; border: 0.5px solid #C7C2BB; border-radius: 999px; cursor: pointer;">video</button>
    <button style="padding: 8px 14px; font-size: 13px; color: #8B8681; background: transparent; border: 0.5px solid #C7C2BB; border-radius: 999px; cursor: pointer;">news</button>
  </div>

  <button style="margin-top: auto; padding: 16px 0; font-size: 16px; letter-spacing: -0.02em; color: #F3F1EE; background: #14120F; border: none; border-radius: 28px; cursor: pointer;">Start</button>

</div>
