<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500&family=Sometype+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #14120F; } a:hover { color: #57534E; }
    .rise {
      opacity: 1;
      transform: none;
      transition: opacity 280ms cubic-bezier(0.23, 1, 0.32, 1), transform 280ms cubic-bezier(0.23, 1, 0.32, 1);
    }
    @starting-style { .rise { opacity: 0; transform: translateY(8px); } }
    @media (prefers-reduced-motion: reduce) { .rise { transition: none; } }
  </style>
</helmet>
<div style="width: 880px; height: 1120px; box-sizing: border-box; background: #F3F1EE; font-family: 'Public Sans', system-ui, sans-serif; color: #14120F; letter-spacing: -0.02em; padding: 72px 80px; display: flex; flex-direction: column; gap: 40px;">

  <p class="rise" style="margin: 0; font-size: 13px; color: #8B8681; transition-delay: 0ms;">You meant to</p>

  <div class="rise" style="border: 1.5px solid #14120F; border-radius: 36px; padding: 22px 32px; transition-delay: 60ms;">
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 28px; line-height: 1.25; letter-spacing: -0.02em;">finish the client proposal</p>
  </div>

  <div class="rise" style="display: flex; flex-direction: column; gap: 0; transition-delay: 120ms;">
    <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 20px; align-items: center; padding: 10px 0;">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: {{step.fill}}; border: 1px solid {{step.edge}}; box-sizing: border-box;"></span>
        <p style="margin: 0; font-size: 16px; color: {{step.ink}};">{{step.text}}</p>
      </div>
    </sc-for>
  </div>

  <div class="rise" style="display: flex; gap: 4px; height: 32px; transition-delay: 180ms;">
    <div style="flex: 41; background: #C75B39; border-radius: 16px;"></div>
    <div style="flex: 12; background: #D68A6E; border-radius: 16px;"></div>
    <div style="flex: 9; background: #E2B29E; border-radius: 16px;"></div>
    <div style="flex: 6; border-radius: 16px; background: repeating-linear-gradient(135deg, #8B8681 0 2px, transparent 2px 6px); border: 1px solid #C7C2BB;"></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 0;">
    <sc-for list="{{rows}}" as="row" hint-placeholder-count="4">
      <div class="rise" style="display: grid; grid-template-columns: 14px minmax(0, 1fr) 88px; gap: 20px; align-items: center; padding: 14px 0; border-bottom: 0.5px solid #E2DFDB; transition-delay: {{row.delay}};">
        <span style="width: 14px; height: 14px; border-radius: 4px; background: {{row.swatch}};"></span>
        <p style="margin: 0; font-size: 16px; color: {{row.ink}};">{{row.domain}}</p>
        <p style="margin: 0; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 14px; text-align: right; font-variant-numeric: tabular-nums;">{{row.figure}}</p>
      </div>
    </sc-for>
  </div>

  <p class="rise" style="margin: 0; font-size: 15px; line-height: 1.45; color: #57534E; transition-delay: 440ms;">Drifted twice, back within ninety seconds both times. Two blocked attempts.</p>

  <div class="rise" style="display: flex; flex-direction: column; gap: 20px; margin-top: auto; transition-delay: 500ms;">
    <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; line-height: 1.05; letter-spacing: -0.03em;">Did you?</p>
    <div style="display: flex; gap: 14px;">
      <button style="flex-grow: 1; padding: 16px 0; font-family: 'Public Sans', system-ui, sans-serif; font-size: 16px; letter-spacing: -0.02em; color: #14120F; background: transparent; border: 1.5px solid #14120F; border-radius: 28px; cursor: pointer;">Yes</button>
      <button style="flex-grow: 1; padding: 16px 0; font-family: 'Public Sans', system-ui, sans-serif; font-size: 16px; letter-spacing: -0.02em; color: #14120F; background: transparent; border: 1.5px solid #14120F; border-radius: 28px; cursor: pointer;">Not yet</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":880,"height":1120}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { text: 'outline the scope',         fill: '#C75B39',     edge: '#C75B39', ink: '#8B8681' },
        { text: 'write the pricing section', fill: '#C75B39',     edge: '#C75B39', ink: '#8B8681' },
        { text: 'send it',                   fill: 'transparent', edge: '#C7C2BB', ink: '#14120F' }
      ],
      rows: [
        { domain: 'claude.ai', figure: '41 min', swatch: '#C75B39', ink: '#14120F', delay: '240ms' },
        { domain: 'docs.google.com', figure: '12 min', swatch: '#D68A6E', ink: '#14120F', delay: '290ms' },
        { domain: 'news.ycombinator.com', figure: '9 min', swatch: '#E2B29E', ink: '#14120F', delay: '340ms' },
        { domain: 'away', figure: '6 min', swatch: 'repeating-linear-gradient(135deg, #8B8681 0 2px, transparent 2px 6px)', ink: '#8B8681', delay: '390ms' }
      ]
    };
  }
}
</script>
</body>
</html>
