<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500;600&family=Sometype+Mono:wght@400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FAF8F5; }
    * { box-sizing: border-box; }
    a { color: #14120F; text-decoration: none; }
  </style>
</helmet>
<div style="width: 1000px; min-height: 900px; margin: 0 auto; padding: 48px 64px 80px; font-family: 'Public Sans', system-ui, sans-serif; color: #14120F; display: flex; flex-direction: column; gap: 24px; position: relative;">

  <!-- Period Bar -->
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h1 style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 32px; font-weight: 600; letter-spacing: -0.02em;">Today &middot; Friday, Sep 18</h1>
    <div style="display: flex; gap: 4px; align-items: center; background: #F3F1EE; border-radius: 8px; padding: 3px; border: 0.5px solid #E2DFDB;">
      <span style="font-size: 13px; font-weight: 500; padding: 4px 12px; background: #FFFFFF; border-radius: 6px; box-shadow: 0 1px 2px rgba(20,18,15,0.05);">Today</span>
    </div>
  </div>

  <!-- Hero: Daily Timeline -->
  <section style="background: #FFFFFF; border: 0.5px solid #E2DFDB; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(20, 18, 15, 0.03);">
    <div style="display: flex; justify-content: space-between; padding: 12px 20px; font-family: 'Public Sans', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #8B8681; border-bottom: 0.5px solid #E2DFDB; background: #F3F1EE;">
      <span>Daily Timeline</span>
      <span>Friday, Sep 18, 2026</span>
    </div>
    <div style="padding: 24px 28px 20px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <div style="font-family: Fraunces, Georgia, serif; font-size: 24px; font-weight: 600; color: #14120F;">
          Today: 5 hr 54 min focus
        </div>
        <div style="display: flex; gap: 8px; font-size: 13px; color: #57534E;">
          <span><strong>8</strong> sessions logged</span>
          <span>&bull;</span>
          <span><strong>354 min</strong> attended</span>
          <span>&bull;</span>
          <span><strong>40 min</strong> away</span>
          <span>&bull;</span>
          <span><strong>5 min</strong> breaks</span>
        </div>
      </div>

      <!-- Timeline Track (04:00 to 22:00) -->
      <div style="height: 48px; background: #F3F1EE; border-radius: 8px; position: relative; overflow: hidden; border: 0.5px solid #E2DFDB;">
        <div style="position: absolute; left: 38%; width: 5%; height: 100%; display: flex; border-radius: 4px; overflow: hidden;">
          <div style="width: 80%; background: #C75B39;"></div>
          <div style="width: 20%; background: repeating-linear-gradient(135deg, #8B8681 0 2px, transparent 2px 6px); border-left: 0.5px solid #C7C2BB;"></div>
        </div>
      </div>

      <!-- Hours Scale -->
      <div style="display: flex; justify-content: space-between; font-family: 'Sometype Mono', monospace; font-size: 11px; color: #8B8681; padding: 0 4px;">
        <span>04:00</span>
        <span>06:00</span>
        <span>08:00</span>
        <span>10:00</span>
        <span>12:00</span>
        <span>14:00</span>
        <span>16:00</span>
        <span>18:00</span>
        <span>20:00</span>
        <span>22:00</span>
      </div>
    </div>
  </section>

  <!-- Today's Sessions Panel -->
  <section style="background: #FFFFFF; border: 0.5px solid #E2DFDB; border-radius: 16px; overflow: hidden; box-shadow: 0 1px 3px rgba(20, 18, 15, 0.03);">
    <div style="display: flex; justify-content: space-between; padding: 12px 20px; font-family: 'Public Sans', sans-serif; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #8B8681; border-bottom: 0.5px solid #E2DFDB; background: #F3F1EE;">
      <span>Today's Sessions</span>
      <span>8 Completed</span>
    </div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{rows}}" as="row" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 180px 96px 64px; gap: 20px; align-items: center; padding: 14px 20px; border-bottom: 0.5px solid #E2DFDB;">
          <div style="font-size: 14px; font-weight: 500; color: #14120F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{row.intention}}</div>
          <div style="height: 10px; display: flex; gap: 2px; border-radius: 4px; overflow: hidden; background: #F3F1EE; border: 0.5px solid #E2DFDB;">
            <div style="flex: {{row.a}}; background: #C75B39;"></div>
            <div style="flex: {{row.b}}; background: repeating-linear-gradient(135deg, #8B8681 0 2px, transparent 2px 6px); border-left: 0.5px solid #C7C2BB;"></div>
          </div>
          <div style="display: inline-flex; align-items: center; gap: 6px; font-family: 'Sometype Mono', monospace; font-size: 12px;">
            <span style="width: 7px; height: 7px; border-radius: 50%; background: {{row.dotColor}};"></span>
            <span>{{row.outcome}}</span>
          </div>
          <div style="font-family: 'Sometype Mono', monospace; font-size: 12px; text-align: right; color: #57534E;">{{row.duration}}</div>
        </div>
      </sc-for>
    </div>
  </section>

  <!-- Anchored Tomato Companion Actor -->
  <div style="position: fixed; bottom: 32px; right: 40px; width: 64px; height: 64px; filter: drop-shadow(0 6px 12px rgba(20, 18, 15, 0.12));">
    <img src="/assets/the-tomato-transparent.png" alt="MEANT Companion" style="width: 100%; height: 100%; object-fit: contain;">
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1000,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      rows: [
        { intention: 'database migration verification', outcome: 'Yes', dotColor: '#C75B39', duration: '53m', a: 85, b: 15 },
        { intention: 'inbox zero attempt', outcome: 'Not yet', dotColor: '#C75B39', duration: '35m', a: 60, b: 40 },
        { intention: 'sprint roadmap review', outcome: 'Yes', dotColor: '#C75B39', duration: '30m', a: 100, b: 0 },
        { intention: 'design token audit', outcome: 'Yes', dotColor: '#C75B39', duration: '43m', a: 95, b: 5 },
        { intention: 'architecture RFC writeup', outcome: 'Yes', dotColor: '#C75B39', duration: '1h 15m', a: 92, b: 8 },
        { intention: 'review staging deployments', outcome: 'Not yet', dotColor: '#C75B39', duration: '1h 15m', a: 80, b: 20 },
        { intention: 'reply to the vendor thread', outcome: 'Yes', dotColor: '#C75B39', duration: '18m', a: 90, b: 10 },
        { intention: 'finish the client proposal', outcome: 'Yes', dotColor: '#C75B39', duration: '1h 10m', a: 90, b: 10 }
      ]
    };
  }
}
</script>
</body>
</html>
