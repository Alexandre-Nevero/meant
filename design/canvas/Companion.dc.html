<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Public+Sans:wght@400;500&family=Sometype+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #14120F; } a:hover { color: #57534E; }
    /* Aliveness: breathing, and a rare blink. Never reads as animation. */
    @keyframes breathe { 0%, 100% { opacity: 0.92; transform: scaleY(1); } 50% { opacity: 1; transform: scaleY(1.06); } }
    @keyframes blink { 0%, 96%, 100% { opacity: 1; } 97.5% { opacity: 0.15; } }
    .aperture { transform-origin: center; animation: breathe 4.2s ease-in-out infinite, blink 6.7s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .aperture { animation: none; } }
  </style>
</helmet>
<div style="width: 820px; height: 620px; box-sizing: border-box; background: #E9E6E2; font-family: 'Public Sans', system-ui, sans-serif; color: #14120F; letter-spacing: -0.02em; padding: 40px; display: flex; gap: 40px;">

  <!-- SETTLED -->
  <div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
    <p style="margin: 0; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 11px; color: #8B8681; text-transform: uppercase; letter-spacing: 0.08em;">Settled — facing your work</p>

    <div style="flex-grow: 1; background: #F3F1EE; border-radius: 20px; padding: 26px 22px; display: flex; flex-direction: column; gap: 26px; box-sizing: border-box;">

      <div style="display: flex; justify-content: center; padding: 10px 0 4px;">
        <div style="width: 104px; height: 104px; border: 1.5px solid #14120F; border-radius: 34px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 20px; box-sizing: border-box;">
          <div class="aperture" style="width: 44px; height: 10px; border-radius: 5px; background: #C75B39;"></div>
        </div>
      </div>

      <div style="border: 1px solid #E2DFDB; border-radius: 20px; padding: 14px 18px;">
        <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 16px; line-height: 1.3; letter-spacing: -0.02em;">finish the client proposal</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0;">
        <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11px 0; border-bottom: 0.5px solid #E2DFDB;">
            <span style="width: 12px; height: 12px; border-radius: 4px; background: {{step.fill}}; border: 1px solid {{step.edge}}; box-sizing: border-box;"></span>
            <p style="margin: 0; font-size: 14px; color: {{step.ink}};">{{step.text}}</p>
          </div>
        </sc-for>
      </div>

      <p style="margin: auto 0 0; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 11px; color: #8B8681;">reading this tab</p>
    </div>
  </div>

  <!-- DRIFTING -->
  <div style="display: flex; flex-direction: column; gap: 14px; flex-grow: 1;">
    <p style="margin: 0; font-family: 'Sometype Mono', ui-monospace, monospace; font-size: 11px; color: #8B8681; text-transform: uppercase; letter-spacing: 0.08em;">Drifting — facing you</p>

    <div style="flex-grow: 1; background: #F3F1EE; border-radius: 20px; padding: 26px 22px; display: flex; flex-direction: column; gap: 26px; box-sizing: border-box;">

      <div style="display: flex; justify-content: center; padding: 10px 0 4px;">
        <div style="width: 104px; height: 104px; border: 2px solid #14120F; border-radius: 34px; display: flex; align-items: center; justify-content: center; box-sizing: border-box;">
          <div class="aperture" style="width: 44px; height: 30px; border-radius: 15px; background: #C75B39;"></div>
        </div>
      </div>

      <div style="border: 1px solid #E2DFDB; border-radius: 20px; padding: 14px 18px;">
        <p style="margin: 0; font-family: Fraunces, Georgia, serif; font-size: 16px; line-height: 1.3; letter-spacing: -0.02em;">finish the client proposal</p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0;">
        <sc-for list="{{steps}}" as="step" hint-placeholder-count="3">
          <div style="display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11px 0; border-bottom: 0.5px solid #E2DFDB;">
            <span style="width: 12px; height: 12px; border-radius: 4px; background: {{step.fill}}; border: 1px solid {{step.edge}}; box-sizing: border-box;"></span>
            <p style="margin: 0; font-size: 14px; color: {{step.ink}};">{{step.text}}</p>
          </div>
        </sc-for>
      </div>

      <button style="margin: auto 0 0; padding: 11px 0; font-family: 'Public Sans', system-ui, sans-serif; font-size: 13px; letter-spacing: -0.02em; color: #14120F; background: transparent; border: 0.5px solid #14120F; border-radius: 999px; cursor: pointer;">That&#39;s work</button>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":820,"height":620}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      steps: [
        { text: 'outline the scope',        fill: '#C75B39',   edge: '#C75B39', ink: '#8B8681' },
        { text: 'write the pricing section', fill: '#C75B39',   edge: '#C75B39', ink: '#8B8681' },
        { text: 'send it',                   fill: 'transparent', edge: '#C7C2BB', ink: '#14120F' }
      ]
    };
  }
}
</script>
</body>
</html>
